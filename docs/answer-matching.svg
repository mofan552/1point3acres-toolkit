<text x="400" y="57" class="h">题库里的答案</text>
<text x="368" y="88" class="s">「美国哪个州没有夏令时？」</text>
<rect x="368.0" y="102.0" width="85.0" height="28.0" rx="14.0" class="c-green"/>
<text x="410" y="121" class="xs t-green" text-anchor="middle" style="font-size:13px">亚利桑那州</text>
<text x="368" y="156" class="xs">仓库自带的题库（194 题）</text>
<text x="368" y="176" class="xs">＋ 你电脑上学到的答案</text>
<text x="368" y="196" class="xs">两边冲突时，以你电脑上的为准</text>
<path d="M352.0,147.0 L312.0,147.0" class="ar green"/>
