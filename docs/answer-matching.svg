<g transform="translate(38.0,298.5) scale(0.833)" class="ic ic-blue"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></g>
<text x="68" y="314" class="s">比对前先统一格式（全角半角、多余空格），然后按选项的文字比，不看 A/B/C/D 的位置，网站把顺序打乱也没关系。</text>
