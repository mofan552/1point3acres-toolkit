<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-label="接给 AI 助手：MCP 是怎么接的">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',Helvetica,Arial,sans-serif;fill:#1f2328}
.h{font-size:19px;font-weight:700}.b{font-size:14.5px;font-weight:600}.t{font-size:13px}.s{font-size:12.5px;fill:#57606a}
.box{stroke-width:1.3}.white{fill:#fff;stroke:#d0d7de}.blue{fill:#ddf4ff;stroke:#54aeff}.green{fill:#dafbe1;stroke:#4ac26b}.gray{fill:#f6f8fa;stroke:#d0d7de}
.ar{stroke:#57606a;stroke-width:1.6;fill:none;marker-end:url(#ar);marker-start:url(#ar)}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="339" rx="12" fill="#fff" stroke="#d0d7de"/>
<text x="24" y="36" class="h">接给 AI 助手：MCP 是怎么接的</text>

<rect x="24" y="66" width="250" height="90" rx="10" class="box white"/>
<text x="38" y="92" class="b">Claude Code / Codex</text>
<text x="38" y="114" class="s">或任何支持本地 stdio 的</text>
<text x="38" y="132" class="s">MCP 客户端</text>
<path d="M280,111 L354,111" class="ar"/>
<text x="317" y="100" class="s" text-anchor="middle">stdio</text>
<text x="317" y="132" class="s" text-anchor="middle">进程间管道</text>
<rect x="360" y="66" width="250" height="90" rx="10" class="box blue"/>
<text x="374" y="92" class="b">mcp_server.py</text>
<text x="374" y="114" class="s">32 个工具，每个都有只读 /</text>
<text x="374" y="132" class="s">可写的标注，参数强类型</text>
<path d="M616,111 L690,111" class="ar"/>
<text x="653" y="100" class="s" text-anchor="middle">直接调用</text>
<rect x="696" y="66" width="240" height="90" rx="10" class="box green"/>
<text x="710" y="92" class="b">和命令行相同的函数</text>
<text x="710" y="114" class="s">同一份账号会话、同一个数据库、</text>
<text x="710" y="132" class="s">同样的安全边界</text>

<rect x="24" y="180" width="912" height="140" rx="10" class="box gray"/>
<text x="40" y="206" class="t">· 本地进程间通信，不开任何网络端口、不需要公网地址；客户端启动它、用完关掉。</text>
<text x="40" y="232" class="t">· 检查.sh --sync 会生成 mcp.config.json（含本机路径，不含密码，不入库），把里面那一项合并进客户端配置即可。</text>
<text x="40" y="258" class="t">· 多传的参数直接拒绝，不会被悄悄忽略；每个工具的说明里写清了会不会碰站点。</text>
<text x="40" y="284" class="t">· daily_run、stripe_collect 这类会真的操作站点，让助手确认要做了再调；interviews_search 之类纯离线，可以随便试。</text>
<text x="40" y="308" class="s">可用工具名以 architecture.json 里的 public_tools 为准，检查.sh 会核对代码和清单一致。</text>
</svg>
