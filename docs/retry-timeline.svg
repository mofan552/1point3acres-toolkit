<text x="40" y="74" class="xs">几分钟内</text>
<rect x="214.0" y="42.0" width="90.0" height="28.0" rx="14.0" class="c-gray"/>
<g transform="translate(224.0,48.5) scale(0.625)" class="ic ic-blue"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/></g>
<text x="268" y="60" class="xs t-gray" text-anchor="middle" style="font-size:12.5px">到期触发</text>
<path d="M307.0,56.0 L323.0,56.0" class="ar"/>
<rect x="326.0" y="42.0" width="63.2" height="28.0" rx="14.0" class="c-green"/>
<text x="358" y="60" class="xs t-green" text-anchor="middle" style="font-size:12.5px">签到 ✓</text>
<path d="M392.2,56.0 L408.2,56.0" class="ar"/>
<rect x="411.2" y="42.0" width="117.0" height="28.0" rx="14.0" class="c-red"/>
<text x="470" y="60" class="xs t-red" text-anchor="middle" style="font-size:12.5px">答题 ✗ 网络超时</text>
<path d="M531.2,56.0 L547.2,56.0" class="ar"/>
<rect x="550.2" y="42.0" width="142.4" height="28.0" rx="14.0" class="c-blue"/>
<g transform="translate(560.2,48.5) scale(0.625)" class="ic ic-blue"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></g>
<text x="630" y="60" class="xs t-blue" text-anchor="middle" style="font-size:12.5px">换新 Chrome 重跑</text>
<path d="M695.6,56.0 L711.6,56.0" class="ar"/>
<rect x="714.6" y="42.0" width="108.2" height="28.0" rx="14.0" class="c-green"/>
<text x="769" y="60" class="xs t-green" text-anchor="middle" style="font-size:12.5px">答题 ✓ 到账 ✓</text>
<path d="M825.9,56.0 L841.9,56.0" class="ar"/>
<rect x="844.9" y="42.0" width="65.0" height="28.0" rx="14.0" class="c-green"/>
<g transform="translate(854.9,48.5) scale(0.625)" class="ic ic-green"><path d="M20 6 9 17l-5-5"/></g>
<text x="886" y="60" class="xs t-green" text-anchor="middle" style="font-size:12.5px">圆满</text>
<rect x="24.0" y="112.0" width="170.0" height="64.0" rx="12" class="c-gray"/>
<text x="40" y="140" class="h">下一次计划</text>
<text x="40" y="162" class="xs">10 分钟后</text>
<rect x="214.0" y="130.0" width="84.5" height="28.0" rx="14.0" class="c-red"/>
<text x="256" y="148" class="xs t-red" text-anchor="middle" style="font-size:12.5px">重跑也失败</text>
<path d="M301.5,144.0 L317.5,144.0" class="ar"/>
<rect x="320.5" y="130.0" width="116.0" height="28.0" rx="14.0" class="c-gray"/>
<g transform="translate(330.5,136.5) scale(0.625)" class="ic ic-blue"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/></g>
<text x="388" y="148" class="xs t-gray" text-anchor="middle" style="font-size:12.5px">16:20 再触发</text>
<path d="M439.5,144.0 L455.5,144.0" class="ar"/>
<rect x="458.5" y="130.0" width="147.0" height="28.0" rx="14.0" class="c-blue"/>
<text x="532" y="148" class="xs t-blue" text-anchor="middle" style="font-size:12.5px">签到已确认，只补答题</text>
<path d="M608.5,144.0 L624.5,144.0" class="ar"/>
<rect x="627.5" y="130.0" width="63.2" height="28.0" rx="14.0" class="c-green"/>
<text x="659" y="148" class="xs t-green" text-anchor="middle" style="font-size:12.5px">答题 ✓</text>
<path d="M693.8,144.0 L709.8,144.0" class="ar"/>
<rect x="712.8" y="130.0" width="65.0" height="28.0" rx="14.0" class="c-green"/>
<g transform="translate(722.8,136.5) scale(0.625)" class="ic ic-green"><path d="M20 6 9 17l-5-5"/></g>
<text x="754" y="148" class="xs t-green" text-anchor="middle" style="font-size:12.5px">圆满</text>
<rect x="24.0" y="200.0" width="170.0" height="64.0" rx="12" class="c-gray"/>
<text x="40" y="228" class="h">第二天</text>
<text x="40" y="250" class="xs">独立的观察者</text>
<rect x="214.0" y="218.0" width="84.5" height="28.0" rx="14.0" class="c-red"/>
<text x="256" y="236" class="xs t-red" text-anchor="middle" style="font-size:12.5px">整天都失败</text>
<path d="M301.5,232.0 L317.5,232.0" class="ar"/>
<rect x="320.5" y="218.0" width="165.0" height="28.0" rx="14.0" class="c-amber"/>
<g transform="translate(330.5,224.5) scale(0.625)" class="ic ic-amber"><path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/></g>
<text x="412" y="236" class="xs t-amber" text-anchor="middle" style="font-size:12.5px">观察者发现连续没完成</text>
<path d="M488.5,232.0 L504.5,232.0" class="ar"/>
<rect x="507.5" y="218.0" width="77.5" height="28.0" rx="14.0" class="c-amber"/>
<g transform="translate(517.5,224.5) scale(0.625)" class="ic ic-amber"><path d="M10.3 21a2 2 0 0 0 3.4 0"/><path d="M3.3 15.3A1 1 0 0 0 4 17h16a1 1 0 0 0 .7-1.7C19.4 14 18 12.5 18 8A6 6 0 0 0 6 8c0 4.5-1.4 6-2.7 7.3"/></g>
<text x="555" y="236" class="xs t-amber" text-anchor="middle" style="font-size:12.5px">提醒你</text>
<rect x="24.0" y="284.0" width="912.0" height="43.0" rx="10" class="c-gray"/>
<g transform="translate(38.0,292.5) scale(0.833)" class="ic ic-blue"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></g>
<text x="68" y="308" class="s">每一层都不重复已确认的动作：签到到账了，后面只做答题；网站已经回应过的提交也绝不重交。</text>
</svg>
