<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-label="一天的结论是怎么算出来的">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',Helvetica,Arial,sans-serif;fill:#1f2328}
.h{font-size:19px;font-weight:700}.b{font-size:14.5px;font-weight:600}.t{font-size:13.5px}.s{font-size:12.5px;fill:#57606a}
.pill{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:600}
.ar{stroke:#57606a;stroke-width:1.6;fill:none;marker-end:url(#ar)}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="569" rx="12" fill="#fff" stroke="#d0d7de"/>
<text x="24" y="36" class="h">一天的结论（status）是怎么算出来的</text>

<rect x="24" y="60" width="912" height="62" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="40" y="84" class="b">运行结束时读两样东西：</text>
<text x="40" y="108" class="t">① 账号状态：身份接口里签到、答题两个「已完成」标志　　② 积分流水：当天两条奖励记录有没有、是不是你的</text>

<path d="M480,122 L480,144" class="ar"/>
<polygon points="220,180 480,146 740,180 480,214" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.3"/>
<text x="480" y="185" class="t" text-anchor="middle">两个标志都是已完成，且两项奖励都核对到账？</text>
<path d="M740,180 L770,180" class="ar"/><text x="746" y="172" class="s">是</text>
<rect x="770" y="150" width="166" height="60" rx="8" fill="#dafbe1" stroke="#4ac26b"/>
<text x="784" y="176" class="pill">complete</text>
<text x="784" y="198" class="s">今天圆满，退出码 0</text>

<path d="M480,214 L480,236" class="ar"/><text x="488" y="230" class="s">否</text>
<polygon points="220,270 480,236 740,270 480,304" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.3"/>
<text x="480" y="275" class="t" text-anchor="middle">有提交发出去了、却一直没等到站点回执？</text>
<path d="M740,270 L770,270" class="ar"/><text x="746" y="262" class="s">是</text>
<rect x="770" y="240" width="166" height="60" rx="8" fill="#ffebe9" stroke="#ff8182"/>
<text x="784" y="266" class="pill">failed</text>
<text x="784" y="288" class="s">submission_unconfirmed</text>

<path d="M480,304 L480,326" class="ar"/><text x="488" y="320" class="s">否</text>
<polygon points="220,360 480,326 740,360 480,394" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.3"/>
<text x="480" y="365" class="t" text-anchor="middle">本机历史说某项完成过，站点现在却说没完成？</text>
<path d="M740,360 L770,360" class="ar"/><text x="746" y="352" class="s">是</text>
<rect x="770" y="330" width="166" height="60" rx="8" fill="#fff1e5" stroke="#fb8f44"/>
<text x="784" y="356" class="pill">needs_attention</text>
<text x="784" y="378" class="s">daily_history_conflict</text>

<path d="M480,394 L480,416" class="ar"/><text x="488" y="410" class="s">否</text>
<rect x="290" y="416" width="380" height="64" rx="8" fill="#fff1e5" stroke="#fb8f44"/>
<text x="304" y="442" class="pill">needs_attention</text>
<text x="304" y="464" class="s">例如题库没题（answer_needed）、完成了但没查到奖励</text>

<rect x="24" y="500" width="912" height="56" rx="8" fill="#f6f8fa"/>
<text x="40" y="522" class="s">中途抛错（网络、验证、浏览器断开）→ failed，错误名原样记录。不论结果如何，这次运行都写进本机历史；</text>
<text x="40" y="542" class="s">连历史都写不进去，也算 failed（daily_history_write_failed），不会假装成功。</text>
</svg>
