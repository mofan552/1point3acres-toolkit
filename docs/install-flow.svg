<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-label="安装七步：克隆、建环境、检查、配账号、登录、跑一次、配计划">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',Helvetica,Arial,sans-serif;fill:#1f2328}
.h{font-size:19px;font-weight:700}.b{font-size:13.5px;font-weight:600}.s{font-size:11.5px;fill:#57606a}.n{font-size:13px;font-weight:700;fill:#fff}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#57606a}
.box{stroke-width:1.3;fill:#fff;stroke:#d0d7de}
.ar{stroke:#57606a;stroke-width:1.6;fill:none;marker-end:url(#ar)}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="249" rx="12" fill="#fff" stroke="#d0d7de"/>
<text x="24" y="36" class="h">安装七步（每台电脑做一次，之后全自动）</text>

<rect x="24" y="66" width="196" height="72" rx="8" class="box"/>
<circle cx="44" cy="86" r="11" fill="#0969da"/><text x="44" y="90" class="n" text-anchor="middle">1</text>
<text x="62" y="90" class="b">克隆仓库</text>
<text x="38" y="112" class="m">git clone &lt;仓库地址&gt;</text>
<text x="38" y="128" class="s">先装好 Git、Chrome、Python 3.12</text>
<path d="M220,102 L246,102" class="ar"/>

<rect x="248" y="66" width="246" height="72" rx="8" class="box"/>
<circle cx="268" cy="86" r="11" fill="#0969da"/><text x="268" y="90" class="n" text-anchor="middle">2</text>
<text x="286" y="90" class="b">建虚拟环境、装依赖</text>
<text x="262" y="112" class="m">python3.12 -m venv work/cf-probe-venv</text>
<text x="262" y="128" class="m">pip install -r requirements.txt</text>
<path d="M494,102 L520,102" class="ar"/>

<rect x="522" y="66" width="190" height="72" rx="8" class="box"/>
<circle cx="542" cy="86" r="11" fill="#0969da"/><text x="542" y="90" class="n" text-anchor="middle">3</text>
<text x="560" y="90" class="b">跑一次安装检查</text>
<text x="536" y="112" class="m">./检查.sh --sync</text>
<text x="536" y="128" class="s">看到 status=complete 才继续</text>
<path d="M712,102 L738,102" class="ar"/>

<rect x="740" y="66" width="196" height="72" rx="8" class="box"/>
<circle cx="760" cy="86" r="11" fill="#0969da"/><text x="760" y="90" class="n" text-anchor="middle">4</text>
<text x="778" y="90" class="b">配账号、存密码</text>
<text x="754" y="112" class="s">写 account.json（用户名 + uid）</text>
<text x="754" y="128" class="m">… | ./运行.sh save-credentials</text>

<path d="M838,138 L838,150 L124,150 L124,162" class="ar"/>

<rect x="24" y="164" width="240" height="72" rx="8" class="box"/>
<circle cx="44" cy="184" r="11" fill="#0969da"/><text x="44" y="188" class="n" text-anchor="middle">5</text>
<text x="62" y="188" class="b">登录一次</text>
<text x="38" y="210" class="m">./运行.sh session-login</text>
<text x="38" y="226" class="s">看到 session_usable=true 就成功</text>
<path d="M264,200 L290,200" class="ar"/>

<rect x="292" y="164" width="270" height="72" rx="8" class="box"/>
<circle cx="312" cy="184" r="11" fill="#0969da"/><text x="312" y="188" class="n" text-anchor="middle">6</text>
<text x="330" y="188" class="b">手动跑一次签到答题</text>
<text x="306" y="210" class="m">./运行.sh daily</text>
<text x="306" y="226" class="s">status=complete；answer_needed 就补一次答案</text>
<path d="M562,200 L588,200" class="ar"/>

<rect x="590" y="164" width="346" height="72" rx="8" class="box" style="fill:#dafbe1;stroke:#4ac26b"/>
<circle cx="610" cy="184" r="11" fill="#1a7f37"/><text x="610" y="188" class="n" text-anchor="middle">7</text>
<text x="628" y="188" class="b">配每日计划，从此不用管</text>
<text x="604" y="210" class="m">每 10 分钟跑一次：运行.sh daily --resume</text>
<text x="604" y="226" class="s">launchd / 任务计划程序；再配一个健康观察者（推荐）</text>
</svg>
