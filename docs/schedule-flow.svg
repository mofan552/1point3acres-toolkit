<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-label="调度：一天的时间线，什么时候跑，为什么重复触发是安全的">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',Helvetica,Arial,sans-serif;fill:#1f2328}
.h{font-size:19px;font-weight:700}.b{font-size:14.5px;font-weight:600}.t{font-size:13.5px}.s{font-size:12.5px;fill:#57606a}.tick{font-size:12px;fill:#57606a}
</style>
<rect x="0.5" y="0.5" width="959" height="409" rx="12" fill="#fff" stroke="#d0d7de"/>
<text x="24" y="36" class="h">调度：一天的时间线（默认计划时间 16:10，Asia/Shanghai）</text>

<rect x="60" y="120" width="566" height="40" fill="#f6f8fa"/>
<rect x="626" y="120" width="274" height="40" fill="#dafbe1"/>
<line x1="60" y1="160" x2="900" y2="160" stroke="#1f2328" stroke-width="2"/>
<g stroke="#1f2328" stroke-width="1.5">
  <line x1="60" y1="154" x2="60" y2="166"/><line x1="200" y1="154" x2="200" y2="166"/><line x1="340" y1="154" x2="340" y2="166"/>
  <line x1="480" y1="154" x2="480" y2="166"/><line x1="620" y1="154" x2="620" y2="166"/><line x1="760" y1="154" x2="760" y2="166"/><line x1="900" y1="154" x2="900" y2="166"/>
</g>
<text x="60" y="184" class="tick" text-anchor="middle">00:00</text><text x="200" y="184" class="tick" text-anchor="middle">04:00</text><text x="340" y="184" class="tick" text-anchor="middle">08:00</text>
<text x="480" y="184" class="tick" text-anchor="middle">12:00</text><text x="620" y="184" class="tick" text-anchor="middle">16:00</text><text x="760" y="184" class="tick" text-anchor="middle">20:00</text><text x="900" y="184" class="tick" text-anchor="middle">24:00</text>

<g stroke="#8b949e" stroke-width="1">
  <line x1="66" y1="160" x2="66" y2="150"/><line x1="72" y1="160" x2="72" y2="150"/><line x1="78" y1="160" x2="78" y2="150"/><line x1="84" y1="160" x2="84" y2="150"/>
  <line x1="90" y1="160" x2="90" y2="150"/><line x1="96" y1="160" x2="96" y2="150"/><line x1="102" y1="160" x2="102" y2="150"/><line x1="108" y1="160" x2="108" y2="150"/>
</g>
<text x="60" y="108" class="s">↓ 小刻度 = 每 10 分钟触发一次 daily --resume（全天都是这样，绝大多数时候什么都不做就退出）</text>

<line x1="626" y1="88" x2="626" y2="200" stroke="#bc4c00" stroke-width="2.5"/>
<text x="632" y="102" class="b" fill="#bc4c00">计划时间 16:10</text>
<text x="632" y="118" class="s">account.json 里可改时间和时区</text>

<text x="343" y="140" class="s" text-anchor="middle">没到点：daily --resume 直接退出（not_due），不开浏览器</text>
<text x="763" y="140" class="s" text-anchor="middle">到点后执行；完成后 already_complete</text>

<g fill="#8250df">
  <polygon points="66,208 72,216 66,224 60,216"/><polygon points="206,208 212,216 206,224 200,216"/><polygon points="346,208 352,216 346,224 340,216"/>
  <polygon points="486,208 492,216 486,224 480,216"/><polygon points="626,208 632,216 626,224 620,216"/><polygon points="766,208 772,216 766,224 760,216"/>
</g>
<text x="60" y="246" class="s">◆ 恢复时点 00:10 / 04:10 / 08:10 / 12:10 / 16:10 / 20:10：给「按固定时间点触发」的调度器用的 rrule，每 4 小时一个。</text>
<text x="60" y="264" class="s">   检查.sh --sync 会把本地时区和 UTC 两套时刻都打印出来，照着填就行。</text>

<rect x="24" y="280" width="912" height="108" rx="8" fill="#f6f8fa"/>
<text x="40" y="306" class="t">· 站点的「一天」按洛杉矶时间（America/Los_Angeles）计算。工具用它判断今天签没签，不用电脑本地日期，跨时区也不会错。</text>
<text x="40" y="332" class="t">· 电脑睡着错过的触发，醒来后下一次检查会补上；只补「今天」，不补过去几天的签到。</text>
<text x="40" y="358" class="t">· 每次触发都会在本机记一次心跳（即使什么都没做），健康观察者靠它判断调度器有没有死。</text>
<text x="40" y="382" class="t">· 不要给同一个账号配两个调度器。</text>
</svg>
