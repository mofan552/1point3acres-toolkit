<text x="445" y="72" class="h t-blue" text-anchor="middle">10–12 点内抽取</text>
<text x="255" y="178" class="xs" text-anchor="middle">没到点：直接退出，不开浏览器</text>
<text x="671" y="178" class="xs" text-anchor="middle">到点后执行；做完就是「今天已完成」</text>
