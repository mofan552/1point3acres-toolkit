<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="专用 Chrome 和你平时用的浏览器完全隔离">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',Helvetica,Arial,sans-serif;fill:#1f2328}
.h{font-size:19px;font-weight:700}.b{font-size:15px;font-weight:600}.t{font-size:13.5px}.s{font-size:12.5px;fill:#57606a}
</style>
<rect x="0.5" y="0.5" width="959" height="399" rx="12" fill="#fff" stroke="#d0d7de"/>
<text x="24" y="36" class="h">专用 Chrome：和你平时用的浏览器完全隔离</text>

<rect x="24" y="60" width="400" height="180" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="40" y="88" class="b">你平时用的 Chrome</text>
<text x="40" y="116" class="t">· 配置目录在系统默认位置</text>
<text x="40" y="140" class="t">· 你的所有登录、书签、扩展都在这里</text>
<text x="40" y="164" class="t">· 工具永远不碰它</text>
<text x="40" y="188" class="t">· 工具跑的时候你照常用，互不影响</text>

<circle cx="480" cy="150" r="34" fill="#fff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="480" y="146" class="s" text-anchor="middle">互不</text>
<text x="480" y="164" class="s" text-anchor="middle">干扰</text>

<rect x="536" y="60" width="400" height="180" rx="10" fill="#dafbe1" stroke="#4ac26b"/>
<text x="552" y="88" class="b">工具的专用 Chrome</text>
<text x="552" y="116" class="t">· 配置目录：work/account-browser/chrome-profile</text>
<text x="552" y="140" class="t">· 里面只有论坛的登录 Cookie</text>
<text x="552" y="164" class="t">· 调试端口只监听本机 127.0.0.1，端口随机</text>
<text x="552" y="188" class="t">· Windows 放到屏幕外并隐藏；macOS 最小化到 Dock</text>
<text x="552" y="212" class="t">· 一次运行结束就关闭，不常驻后台</text>

<rect x="24" y="262" width="290" height="120" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
<text x="38" y="288" class="b">文件锁</text>
<text x="38" y="312" class="s">work/local-toolkit-state/browser.lock</text>
<text x="38" y="332" class="s">同一时刻只有一个任务能用浏览器，</text>
<text x="38" y="352" class="s">第二个会直接报错退出，不排队</text>

<rect x="335" y="262" width="290" height="120" rx="8" fill="#fbefff" stroke="#c297ff"/>
<text x="349" y="288" class="b">看门狗线程</text>
<text x="349" y="312" class="s">一次运行超过 15 分钟，就从外部</text>
<text x="349" y="332" class="s">强制关掉 Chrome，记为 daily_run_timeout，</text>
<text x="349" y="352" class="s">避免电脑睡着时一直挂着</text>

<rect x="646" y="262" width="290" height="120" rx="8" fill="#fff1e5" stroke="#fb8f44"/>
<text x="660" y="288" class="b">地址白名单</text>
<text x="660" y="312" class="s">只允许打开 1point3acres.com</text>
<text x="660" y="332" class="s">及其登录、接口子域，别的地址</text>
<text x="660" y="352" class="s">在代码里直接拒绝</text>
</svg>
