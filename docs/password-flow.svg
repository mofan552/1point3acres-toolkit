<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="账号和密码是怎么配置、怎么保存的">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',Helvetica,Arial,sans-serif;fill:#1f2328}
.h{font-size:19px;font-weight:700}.b{font-size:14.5px;font-weight:600}.t{font-size:13.5px}.s{font-size:12.5px;fill:#57606a}
.box{stroke-width:1.3}.white{fill:#fff;stroke:#d0d7de}.blue{fill:#ddf4ff;stroke:#54aeff}.green{fill:#dafbe1;stroke:#4ac26b}.gray{fill:#f6f8fa;stroke:#d0d7de}
.ar{stroke:#57606a;stroke-width:1.6;fill:none;marker-end:url(#ar)}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="419" rx="12" fill="#fff" stroke="#d0d7de"/>
<text x="24" y="36" class="h">账号和密码：怎么配置、存在哪、什么时候用</text>

<rect x="24" y="62" width="290" height="64" rx="8" class="box white"/>
<text x="38" y="86" class="b">① 写 account.json</text>
<text x="38" y="108" class="s">用户名 + uid，明文但不敏感；放在 work/ 里不入库</text>
<path d="M314,94 L350,94" class="ar"/>
<rect x="350" y="62" width="270" height="64" rx="8" class="box white"/>
<text x="364" y="86" class="b">② 终端里输一次密码</text>
<text x="364" y="108" class="s">隐藏输入：不显示在屏幕上，不进 shell 历史</text>
<path d="M620,94 L656,94" class="ar"/>
<rect x="656" y="62" width="280" height="64" rx="8" class="box blue"/>
<text x="670" y="86" class="b">③ save-credentials 命令</text>
<text x="670" y="108" class="s">把用户名和密码交给操作系统保管</text>

<path d="M796,126 L796,150 L244,150 L244,170" class="ar"/><path d="M796,150 L716,150 L716,170" class="ar"/>

<rect x="24" y="170" width="440" height="84" rx="8" class="box green"/>
<text x="38" y="194" class="b">macOS：登录钥匙串</text>
<text x="38" y="216" class="s">通过系统自带的 security 命令写入，密码经标准输入传递，</text>
<text x="38" y="236" class="s">不出现在进程列表里；只接受可打印的 ASCII 字符</text>
<rect x="496" y="170" width="440" height="84" rx="8" class="box green"/>
<text x="510" y="194" class="b">Windows：DPAPI</text>
<text x="510" y="216" class="s">用 Windows 数据保护接口加密成 credentials.dpapi 文件，</text>
<text x="510" y="236" class="s">只有同一台电脑、同一个 Windows 用户能解开</text>

<path d="M480,254 L480,278" class="ar"/>
<rect x="24" y="278" width="912" height="60" rx="8" class="box gray"/>
<text x="40" y="302" class="b">④ 运行时：只在需要重新登录的那一刻取出来</text>
<text x="40" y="324" class="s">填进登录页就丢掉。不写日志、不进 AI 助手的对话、不进仓库、不通过网络发给论坛以外的任何地方。</text>

<rect x="24" y="356" width="912" height="48" rx="8" fill="#f6f8fa"/>
<text x="40" y="376" class="s">改了论坛密码就重做一次 ②③。换电脑要重新配，拷密文过去没用。微信注册的账号先在站点或公众号里设一个登录密码。</text>
<text x="40" y="396" class="s">交给 AI 助手安装时也是同样的流程：密码在它弹出的安全输入框里输，助手拿不到明文。</text>
</svg>
