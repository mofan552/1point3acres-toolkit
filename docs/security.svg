<svg xmlns="http://www.w3.org/2000/svg" width="960" height="476" viewBox="0 0 960 476" role="img" aria-label="安全与隐私：哪些东西进仓库，哪些只留在你电脑上">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',Helvetica,Arial,sans-serif;fill:#1f2328}
.h{font-size:19px;font-weight:700}.b{font-size:15px;font-weight:600}.t{font-size:13.5px}.s{font-size:12.5px;fill:#57606a}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
</style>
<rect x="0.5" y="0.5" width="959" height="475" rx="12" fill="#fff" stroke="#d0d7de"/>
<text x="24" y="36" class="h">安全与隐私：什么进仓库，什么只留在你电脑上</text>

<rect x="24" y="60" width="440" height="300" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="40" y="88" class="b">仓库里（会推到 GitHub，任何人可见）</text>
<text x="40" y="118" class="m">*.py</text><text x="212" y="118" class="t">源码</text>
<text x="40" y="144" class="m">answers.json</text><text x="212" y="144" class="t">题库（194 道题）</text>
<text x="40" y="170" class="m">mood-phrases.json</text><text x="212" y="170" class="t">心情短句（321 句）</text>
<text x="40" y="196" class="m">architecture.json</text><text x="212" y="196" class="t">模块依赖白名单</text>
<text x="40" y="222" class="m">account.example.json</text><text x="212" y="222" class="t">账号配置的样例，不含真实信息</text>
<text x="40" y="248" class="m">tests/, README, docs/</text><text x="212" y="248" class="t">测试、文档、配图</text>
<text x="40" y="290" class="s">.gitignore 是「默认全部忽略」的白名单：没登记的文件</text>
<text x="40" y="310" class="s">根本进不了仓库，检查.sh 还会扫描密钥特征和个人路径。</text>

<rect x="496" y="60" width="440" height="300" rx="10" fill="#ffebe9" stroke="#ff8182"/>
<text x="512" y="88" class="b">只在你电脑上（work/ 目录，永不入库）</text>
<text x="512" y="118" class="m">account.json</text><text x="700" y="118" class="t">用户名 + uid + 计划时间</text>
<text x="512" y="144" class="m">钥匙串 / *.dpapi</text><text x="700" y="144" class="t">论坛密码（系统级加密）</text>
<text x="512" y="170" class="m">chrome-profile/</text><text x="700" y="170" class="t">专用 Chrome 的登录 Cookie</text>
<text x="512" y="196" class="m">interviews.sqlite</text><text x="700" y="196" class="t">每日历史、面经资料库</text>
<text x="512" y="222" class="m">latest-daily.json</text><text x="700" y="222" class="t">最近一次运行的完整结果</text>
<text x="512" y="248" class="m">learned-answers.json</text><text x="700" y="248" class="t">本机学到的答案</text>
<text x="512" y="274" class="m">cf-probe-venv/</text><text x="700" y="274" class="t">Python 虚拟环境</text>
<text x="512" y="310" class="s">密码：macOS 存进登录钥匙串，Windows 用 DPAPI 加密，</text>
<text x="512" y="330" class="s">和这台电脑绑定；换电脑要重新配，拷密文没用。</text>

<rect x="24" y="380" width="912" height="78" rx="8" fill="#dafbe1" stroke="#4ac26b"/>
<text x="40" y="406" class="b">网络上只跟一亩三分地自己的域名说话</text>
<text x="40" y="428" class="t">不经过任何第三方服务器、不用打码平台、不上传截图。</text>
<text x="40" y="448" class="t">专用浏览器只允许打开 1point3acres.com 及其登录、接口子域，别的地址在代码里直接拒绝。</text>
</svg>
