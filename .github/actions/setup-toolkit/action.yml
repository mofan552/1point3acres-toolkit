name: Setup toolkit
description: Install the registered Python environment; cache downloads only.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: outputs/一亩三分地本地工具/requirements.txt
    - name: Build environment from registered dependencies
      shell: pwsh
      run: |
        python -m venv work/cf-probe-venv
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $python = if ($IsWindows) { './work/cf-probe-venv/Scripts/python.exe' } else { './work/cf-probe-venv/bin/python' }
        & $python -m pip install -r './outputs/一亩三分地本地工具/requirements.txt'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
